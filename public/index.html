<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <title>Becos & Bocados</title>
</head>
<body>
    <header>
        <div class="container">
            <div class="nav">
                <h1>Becos & Bocados</h1>
                <nav>
                    <a href="#" class="active">Início</a>
                    <a href="#">Explorar</a>
                    <a href="#">Sobre</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h2>Os caminhos mais <span class="highlight">escondidos</span> do mundo</h2>
            <p>Descubra becos cheios de história, arte e alma urbana</p>
            <a href="#todos" class="btn-primary">Explorar Becos</a>
        </div>
    </section>

    <main class="container">
        
        <!-- Carrossel em Destaque -->
        <section class="featured-section">
            <h2 class="section-title">Em Destaque</h2>
            <div class="carousel" id="featured-carousel">
                <button class="carousel-btn prev" id="prev-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="carousel-track" id="carousel-track">
                    <!-- Preenchido via JavaScript -->
                </div>
                <button class="carousel-btn next" id="next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Todos os Becos -->
        <section class="all-becos" id="todos">
            <h2 class="section-title">Todos os Becos</h2>
            <div class="becos-grid" id="becos-container">
                <!-- Cards gerados via JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Becos & Vielas — Explorando o invisível.</p>
        </div>
    </footer>

    <script src="index.js"></script>
</body>
</html>
