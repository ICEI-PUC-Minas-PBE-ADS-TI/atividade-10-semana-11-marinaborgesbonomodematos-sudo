<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <title>Becos & Bocados</title>
</head>
<body>
    <header>
        <div class="container">
            <div class="nav">
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">Becos & Bocados</a></h1>
                <nav>
                    <a href="index.html">Início</a>
                    <a href="index.html#todos">Explorar</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Voltar aos Becos
        </a>

        <div class="detalhes-container">
            <!-- Imagem Principal -->
            <div class="detalhes-imagem">
                <img id="beco-imagem" src="" alt="">
            </div>

            <!-- Informações -->
            <div class="detalhes-info">
                <span id="beco-destaque" class="destaque-tag"></span>
                <h1 id="beco-nome"></h1>
                <p id="beco-cidade" class="cidade-detalhe"></p>
                
                <div class="info-extra">
                    <p><strong>Ano:</strong> <span id="beco-ano"></span></p>
                </div>

                <p id="beco-descricao" class="descricao"></p>
                <div id="galeria"></div>
            </div>
        </div>

        <!-- Sugestões / Outros Becos -->
        <section class="sugestoes">
            <h2 class="section-title">Outros Becos para Explorar</h2>
            <div class="becos-grid" id="sugestoes-container">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Becos & Vielas — Explorando o invisível.</p>
        </div>
    </footer>

    <script src="index.js"></script>
</body>
</html>
